<!DOCTYPE html>
<html>
<head>
    <title>Archiwum - archiwalne zdjęcia i filmy</title>
    <link rel="stylesheet" href="style.css">
        <style>
    body {
        transition: background-color 0.25s, color 0.25s;
    }

    body.dark-mode {
        background-color: #171717 !important;
        color: #eeeeee !important;
    }

    body.dark-mode h1,
    body.dark-mode h2,
    body.dark-mode h3,
    body.dark-mode p,
    body.dark-mode label {
        color: #2DE865;
    }

    body.dark-mode input,
    body.dark-mode textarea,
    body.dark-mode select {
        background-color: #292929;
        color: white;
        border: 1px solid #777;
    }

    #darkModeButton {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        padding: 12px 17px;
        border: 2px solid black;
        border-radius: 30px;
        background: #20df60;
        color: black;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    body.dark-mode .aktualnosc,
    body.dark-mode .post,
    body.dark-mode .forum-post {
        color: white;
    }
</style>
</head>
<body>
    <h1  style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin-left: 50px;">Archiwum</h1>
    
<button id="darkModeButton" onclick="zmienMotyw()">
    🌙 Tryb nocny
</button>

<script>
function ustawMotyw() {
    const nocny = localStorage.getItem("motywStrony") === "nocny";

    document.body.classList.toggle("dark-mode", nocny);

    document.getElementById("darkModeButton").textContent =
        nocny ? "☀️ Tryb dzienny" : "🌙 Tryb nocny";
}

function zmienMotyw() {
    const nocny = !document.body.classList.contains("dark-mode");

    localStorage.setItem(
        "motywStrony",
        nocny ? "nocny" : "dzienny"
    );

    ustawMotyw();
}

ustawMotyw();
</script>
<!-- PRZYCISK MENU -->
<input type="checkbox" id="menuToggle">

<label for="menuToggle" id="menuBtn"
style="position: absolute; top: 20px; left: 95%; width: 100px; cursor: pointer; z-index: 30;">

<img src="manu button.png"
alt="menu_icon" width="50px" style="margin-right: 10px;">

</label>


<!-- MENU -->
<div id="menuContainer">

    <img
        src="menu bcg.png"
        id="menuBg"
        style="position: absolute; top: 0%; left: 83%; width: 600px;"
    >

    <label
        for="menuToggle"
        id="closeBtn"
        style="position: absolute; top: 25px; left: 96%;"
    >X</label>

    <div id="menuLinks" style="position: absolute; top: 70px; left: 85%; width: 600px;">
        <a href="Strona główna.html">Aktualności</a>
        <a href="archiwa.html">Archiwum</a>
        <a href="forum.html">Forum</a>
    </div>

<script>
function otworzMenu() {
    document.getElementById("menuContainer").style.display = "block";
    document.getElementById("menuBtn").style.display = "none";
}

function zamknijMenu() {
    document.getElementById("menuContainer").style.display = "none";
    document.getElementById("menuBtn").style.display = "block";
}
</script>

</body>
</html>
